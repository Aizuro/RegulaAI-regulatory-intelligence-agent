[project]
name = "regula-ai"
version = "0.1.0"
description = "Regulatory Intelligence Agent"
requires-python = "==3.11.*"

dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "langchain==0.3.25",
    "langchain-google-genai==2.1.4",
    "langchain-community==0.3.24",
    "langchain-chroma==0.2.4",
    "langchain-groq==0.3.2",
    "chromadb>=1.0.9",
    "pypdf==5.4.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.13",
    "streamlit==1.45.0",
    "python-dotenv==1.1.0",
]

[tool.fastapi]
entrypoint = "src.api:app"
